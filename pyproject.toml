[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kernel"
version = "0.1.0"
description = "AI Kernel"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "ollama",
    "pydantic>=2",
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
ai-kernel = "ai_kernel.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
